[project]
name = "mie479-capstone"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "matplotlib>=3.11.2",
    "cvxpy>=1.9.3",
    "highspy>=1.16.0",
    "numpy",
    "pandas",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn",
    "seaborn>=0.13.2",
    "wrds==3.5.0",
    "gurobipy>=14.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
