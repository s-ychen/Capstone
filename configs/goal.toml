# uv run python -m src.backtest configs/goal.toml

[inputs]
asset_types = ["corporate", "treasury"]   # any subset of corporate, treasury, mbs
g_annual    = 0.0050      # annualized active return goal over the benchmark
start       = "2021-01"   # start month, snaps to its month-end
T           = 4           # horizon in years, N = 12 T monthly rebalances
risk_tol    = "medium"    # low | medium | high
k_max       = 150         # max bonds held
W           = 1_000_000   # wealth in dollars, sets the minimum lot weights
mode        = "tracking"  # tracking | return
n_cand      = 750         # candidate set: n_cand largest eligible benchmark weights plus holdings

# any Settings field (src/optimize/model.py), set after the presets and not scaled by the risk tolerance
[overrides]
H                  = 2
method             = "heuristic"   # heuristic | misocp
backend            = "gurobipy"
tol_mode           = "relative"
time_limit         = 5
mip_gap            = 1e-2
mip_focus          = 2
mip_cand           = 150
mip_skip_shortfall = true

# tracking mode: each month aim for the rate that still reaches g, between floor and cap x g
[catch_up]
on    = true
cap   = 2.0
floor = 0.0
